  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

    /* 側邊欄 */

      width: 320px;

      padding: 15px 20px;

    }

    .filter-group:last-child {

      width: 100%;

    .search-box {

    .status-badge.已延宕 { background: #fff3e0; color: #ef6c00; }

    /* 主內容區 */

      flex: 1;

      display: flex;

    /* RWD */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;

      .sidebar {

</head>
<body>
  <div class="container">
    <!-- 側邊欄 -->
    <div class="sidebar">
      <div class="sidebar-header">
        <h1>📋 政策承諾追蹤</h1>
        <div class="stats" id="stats">
          <span class="stat">載入中...</span>
        </div>
      </div>

      <div class="about-section">
        本系統每日自動從立法院開放資料平台抓取資料，使用 AI 技術萃取政策承諾並追蹤執行進度。<br>
        <a href="https://data.ly.gov.tw/" target="_blank" rel="noopener">📎 資料來源：立法院開放資料服務平台</a>
      </div>

      <div class="filters">
        <div class="filter-group">
          <label>搜尋標題</label>
          <input type="text" id="searchBox" class="search-box" placeholder="輸入關鍵字搜尋...">
          <div class="search-hint">空白 = OR，+ = AND（例：交通+安全）</div>
        </div>
        <div class="filter-group">
          <label>狀態篩選</label>
          <select id="statusFilter">
            <option value="">全部狀態</option>
            <option value="追蹤中">⏳ 追蹤中</option>
            <option value="已達成">✅ 已達成</option>
            <option value="已延宕">⚠️ 已延宕</option>
            <option value="無更新">💤 無更新</option>
          </select>
        </div>
        <div class="filter-group">
          <label>分類篩選</label>
          <select id="categoryFilter">
            <option value="">全部分類</option>
          </select>
        </div>
      </div>

      <div class="commitment-list" id="commitmentList">
        <div class="loading">載入中...</div>
      </div>
    </div>

    <!-- 主內容區 -->
    <div class="main-content" id="mainContent">
      <div class="empty-state">
        👈 請從左側選擇一個承諾
      </div>
    </div>
  </div>

  <script>
    let indexData = null;
    let currentCommitment = null;

    // 載入索引
    async function loadIndex() {
      try {
        const response = await fetch('commitments/index.json');
        if (!response.ok) throw new Error('無法載入索引');
        indexData = await response.json();
        renderStats();
        renderFilters();
        renderList();
      } catch (error) {
        document.getElementById('commitmentList').innerHTML =
          `<div class="error">❌ ${error.message}</div>`;
      }
    }

    // 渲染統計
    function renderStats() {
      const stats = indexData.status_summary;
      document.getElementById('stats').innerHTML = `
        <span class="stat tracking">⏳ ${stats['追蹤中'] || 0}</span>
        <span class="stat fulfilled">✅ ${stats['已達成'] || 0}</span>
        <span class="stat delayed">⚠️ ${stats['已延宕'] || 0}</span>
        <span class="stat stale">💤 ${stats['無更新'] || 0}</span>
      `;
    }

    // 渲染篩選器
    function renderFilters() {
      const categoryFilter = document.getElementById('categoryFilter');
      indexData.categories.forEach(cat => {
        const option = document.createElement('option');
        option.value = cat.name;
        option.textContent = `${cat.name} (${cat.count})`;
        categoryFilter.appendChild(option);
      });
    }

    // 搜尋邏輯：空白=OR，+=AND
    function matchSearch(title, searchText) {
      if (!searchText.trim()) return true;

      const lowerTitle = title.toLowerCase();
      // 先用空白分割成 OR 條件
      const orTerms = searchText.toLowerCase().split(/\s+/).filter(t => t);

      // 對每個 OR 條件，檢查是否匹配（AND 條件用 + 連接）
      return orTerms.some(orTerm => {
        const andTerms = orTerm.split('+').filter(t => t);
        return andTerms.every(term => lowerTitle.includes(term));
      });
    }

    // 渲染列表
    function renderList() {
      const statusFilter = document.getElementById('statusFilter').value;
      const categoryFilter = document.getElementById('categoryFilter').value;
      const searchText = document.getElementById('searchBox').value;

      let html = '';

      // 處理並排序分類
      const processedCategories = indexData.categories
        .map(category => {
          // 篩選承諾
          const filteredCommitments = category.commitments.filter(c =>
            (!statusFilter || c.status === statusFilter) &&
            matchSearch(c.title, searchText)
          );

          // 按 last_updated 排序（新到舊）
          filteredCommitments.sort((a, b) =>
            (b.last_updated || '').localeCompare(a.last_updated || '')
          );

          // 找出該分類最新更新日期
          const latestDate = filteredCommitments.length > 0
            ? filteredCommitments[0].last_updated
            : null;

          return {
            ...category,
            filteredCommitments,
            latestDate
          };
        })
        .filter(cat =>
          (!categoryFilter || cat.name === categoryFilter) &&
          cat.filteredCommitments.length > 0
        )
        // 按分類最新日期排序（新到舊）
        .sort((a, b) =>
          (b.latestDate || '').localeCompare(a.latestDate || '')
        );

      processedCategories.forEach(category => {
        const categoryId = category.name.replace(/\s+/g, '-');
        html += `
          <div class="category-section">
            <div class="category-header" onclick="toggleCategory('${categoryId}')">
              <span>${category.name} (${category.latestDate || '-'})</span>
              <span class="toggle-icon">▶</span>
            </div>
            <div class="category-items" id="cat-${categoryId}">
              ${category.filteredCommitments.map(c => `
                <div class="commitment-item" data-file="${c.file}" onclick="loadCommitment('${c.file}')">
                  <div class="commitment-title">${c.title}</div>
                  <div class="commitment-meta">
                    <span class="status-badge ${c.status}">${c.status}</span>
                    <span>🔄 ${c.last_updated || '-'}</span>
                    ${c.target_date ? `<span>📅 ${c.target_date}</span>` : ''}
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      });

      document.getElementById('commitmentList').innerHTML = html ||
        '<div class="empty-state">沒有符合條件的承諾</div>';
    }

    // 切換分類展開/收合
    function toggleCategory(categoryId) {
      const header = document.querySelector(`#cat-${categoryId}`).previousElementSibling;
      const items = document.getElementById(`cat-${categoryId}`);
      header.classList.toggle('expanded');
      items.classList.toggle('expanded');
    }

    // 載入承諾詳情
    async function loadCommitment(file) {
      try {
        // 更新選中狀態
        document.querySelectorAll('.commitment-item').forEach(el => {
          el.classList.remove('active');
        });
        document.querySelector(`[data-file="${file}"]`)?.classList.add('active');

        // 載入 Markdown
        const response = await fetch(`commitments/${file}`);
        if (!response.ok) throw new Error('無法載入承諾');
        const markdown = await response.text();

        // 解析 frontmatter
        const frontmatterMatch = markdown.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
        if (!frontmatterMatch) throw new Error('格式錯誤');

        const frontmatter = parseFrontmatter(frontmatterMatch[1]);
        const content = frontmatterMatch[2];

        // 渲染詳情
        renderDetail(frontmatter, content);
      } catch (error) {
        document.getElementById('mainContent').innerHTML =
          `<div class="error">❌ ${error.message}</div>`;
      }
    }

    // 解析 frontmatter
    function parseFrontmatter(yaml) {
      const result = {};
      yaml.split('\n').forEach(line => {
        const match = line.match(/^(\w+):\s*"?([^"]*)"?$/);
        if (match) {
          result[match[1]] = match[2];
        }
      });
      return result;
    }

    // 複製連結功能
    async function copyShareLink(commitmentId) {
      const url = `${window.location.origin}${window.location.pathname}#${commitmentId}`;
      try {
        await navigator.clipboard.writeText(url);
        const btn = document.querySelector('.share-btn');
        btn.innerHTML = '✅ 已複製';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.innerHTML = '🔗 複製連結';
          btn.classList.remove('copied');
        }, 2000);
      } catch (err) {
        alert('複製失敗，請手動複製網址');
      }
    }

    // 渲染詳情
    function renderDetail(meta, content) {
      const statusIcons = {
        '追蹤中': '⏳',
        '已達成': '✅',
        '已延宕': '⚠️',
        '無更新': '💤'
      };

      document.getElementById('mainContent').innerHTML = `
        <div class="commitment-detail">
          <div class="detail-header">
            <h1>${statusIcons[meta.status] || ''} ${meta.title}</h1>
            <button class="share-btn" onclick="copyShareLink('${meta.id}')">🔗 複製連結</button>
          </div>

          <div class="detail-meta">
            <div class="meta-item">
              <span class="label">狀態</span>
              <span class="value status-badge ${meta.status}">${meta.status}</span>
            </div>
            <div class="meta-item">
              <span class="label">分類</span>
              <span class="value">${meta.category}</span>
            </div>
            ${meta.target_date && meta.target_date !== 'null' ? `
            <div class="meta-item">
              <span class="label">目標日期</span>
              <span class="value">${meta.target_date}</span>
            </div>
            ` : ''}
            ${meta.target_value && meta.target_value !== 'null' ? `
            <div class="meta-item">
              <span class="label">目標值</span>
              <span class="value">${meta.target_value}</span>
            </div>
            ` : ''}
            ${meta.responsible_agency && meta.responsible_agency !== 'null' ? `
            <div class="meta-item">
              <span class="label">負責機關</span>
              <span class="value">${meta.responsible_agency}</span>
            </div>
            ` : ''}
            <div class="meta-item">
              <span class="label">最後更新</span>
              <span class="value">${meta.last_updated}</span>
            </div>
          </div>

          ${marked.parse(content)}
        </div>
      `;
    }

    // 事件監聽
    document.getElementById('statusFilter').addEventListener('change', renderList);
    document.getElementById('categoryFilter').addEventListener('change', renderList);
    document.getElementById('searchBox').addEventListener('input', renderList);

    // 初始化
    loadIndex();
  </script>
</body>
