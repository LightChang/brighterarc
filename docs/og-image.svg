<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f5f5f5"/>

  <!-- Header bar -->
  <rect width="1200" height="80" fill="#1565c0"/>

  <!-- Logo area -->
  <rect x="40" y="20" width="40" height="40" rx="8" fill="white"/>
  <path d="M48 30h24M48 40h18M48 50h20" stroke="#1565c0" stroke-width="3" stroke-linecap="round"/>

  <!-- Title -->
  <text x="100" y="52" font-family="system-ui, sans-serif" font-size="28" font-weight="600" fill="white">BrighterArc 政策承諾追蹤</text>

  <!-- Main content area -->
  <rect x="60" y="120" width="1080" height="400" rx="16" fill="white" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.1))"/>

  <!-- Main title -->
  <text x="600" y="200" font-family="system-ui, sans-serif" font-size="48" font-weight="700" fill="#333" text-anchor="middle">追蹤台灣立法院政策承諾</text>

  <!-- Subtitle -->
  <text x="600" y="260" font-family="system-ui, sans-serif" font-size="28" fill="#666" text-anchor="middle">AI 驅動 · 每日自動更新 · 22 大分類</text>

  <!-- Stats boxes -->
  <g transform="translate(180, 310)">
    <!-- 追蹤中 -->
    <rect x="0" y="0" width="180" height="100" rx="12" fill="#e3f2fd"/>
    <text x="90" y="45" font-family="system-ui, sans-serif" font-size="18" fill="#1565c0" text-anchor="middle">追蹤中</text>
    <text x="90" y="80" font-family="system-ui, sans-serif" font-size="32" font-weight="700" fill="#1565c0" text-anchor="middle">516</text>

    <!-- 已達成 -->
    <rect x="220" y="0" width="180" height="100" rx="12" fill="#e8f5e9"/>
    <text x="310" y="45" font-family="system-ui, sans-serif" font-size="18" fill="#2e7d32" text-anchor="middle">已達成</text>
    <text x="310" y="80" font-family="system-ui, sans-serif" font-size="32" font-weight="700" fill="#2e7d32" text-anchor="middle">576</text>

    <!-- 已延宕 -->
    <rect x="440" y="0" width="180" height="100" rx="12" fill="#fff3e0"/>
    <text x="530" y="45" font-family="system-ui, sans-serif" font-size="18" fill="#ef6c00" text-anchor="middle">已延宕</text>
    <text x="530" y="80" font-family="system-ui, sans-serif" font-size="32" font-weight="700" fill="#ef6c00" text-anchor="middle">495</text>

    <!-- 總計 -->
    <rect x="660" y="0" width="180" height="100" rx="12" fill="#f5f5f5" stroke="#ddd"/>
    <text x="750" y="45" font-family="system-ui, sans-serif" font-size="18" fill="#666" text-anchor="middle">總計</text>
    <text x="750" y="80" font-family="system-ui, sans-serif" font-size="32" font-weight="700" fill="#333" text-anchor="middle">1,587</text>
  </g>

  <!-- Footer -->
  <text x="600" y="580" font-family="system-ui, sans-serif" font-size="20" fill="#999" text-anchor="middle">brighterarc.weiqi.kids</text>
</svg>
